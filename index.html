<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC STUDIOS | Turning Business into Brand</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* === BASE STYLES & THEME === */
        :root {
            --bg-color: #050505;
            --primary: #ff0000;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --card-bg: #111111;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* === FIRE PARTICLES CANVAS === */
        #fire-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Background me rakhne ke liye */
            pointer-events: none; /* Taki click events disturb na hon */
        }

        /* === CLICK RIPPLE ANIMATION === */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.6);
            transform: scale(0);
            animation: ripple-anim 0.4s linear;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }

        /* === NAVBAR === */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: transparent;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo img { height: 40px; }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--primary); }
        .nav-btn {
            border: 1px solid white;
            padding: 8px 20px;
            border-radius: 20px;
        }

        /* === HERO SECTION === */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: space-between; /* Text left, Logo Right */
            align-items: center;
            padding: 0 8%;
            position: relative;
        }
        .hero-content {
            max-width: 55%;
            z-index: 2;
        }
        
        .hero-tag {
            color: #ff4444;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 { 
            font-size: 6rem; 
            font-weight: 800; 
            line-height: 1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .hero h1 .outline {
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            display: block;
        }

        .hero p { 
            font-size: 1.2rem; 
            color: var(--text-muted); 
            margin-bottom: 40px; 
            max-width: 80%;
        }
        
        .hero-buttons {
            display: flex;
            gap: 20px;
        }

        .hero-btn {
            padding: 15px 30px;
            background: white;
            color: black;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 30px;
            transition: 0.3s;
        }
        .hero-btn.outline-btn {
            background: transparent;
            color: white;
            border: 1px solid #333;
        }
        .hero-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* === FLOATING LOGO RIGHT SIDE === */
        .hero-image {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .hero-image img {
            width: 100%;
            max-width: 350px;
            animation: floatLogo 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.3));
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(0px); }
        }

        /* Scroll Animation Class */
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        @media(max-width: 768px) {
            .hero { flex-direction: column; justify-content: center; text-align: center; padding-top: 100px; }
            .hero-content { max-width: 100%; }
            .hero h1 { font-size: 3.5rem; }
            .hero p { max-width: 100%; }
            .hero-buttons { justify-content: center; }
            .hero-image { margin-top: 50px; width: 80%; }
            nav { display: none; } /* Mobile me menu simple rakhne ke liye hide kiya hai */
        }
    </style>
</head>
<body>

    <!-- FIRE PARTICLES BACKGROUND -->
    <canvas id="fire-canvas"></canvas>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">
            <img src="https://drive.google.com/uc?export=view&id=1A77SnUtHpmBYSaNXjcNRmf9Wb0Q1WhdJ" alt="ARC STUDIOS Logo">
        </div>
        <div class="nav-links">
            <a href="#services">Services</a>
            <a href="#work">Work</a>
            <a href="#process">Process</a>
            <a href="#team">Team</a>
            <a href="#contact" class="nav-btn">LET'S TALK</a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section id="home" class="hero">
        <div class="hero-content fade-in">
            <p class="hero-tag">■ CREATIVE STUDIO - RAIPUR</p>
            <h1>ARC <span class="outline">STUDIOS</span></h1>
            <h3 style="font-size: 2rem; margin-bottom: 20px;">Turning Businesses Into Brands.</h3>
            <p>We create powerful digital experiences through video editing, cinematic storytelling, graphic design, motion graphics and social media management.</p>
            <div class="hero-buttons">
                <a href="#work" class="hero-btn">VIEW OUR WORK</a>
                <a href="#contact" class="hero-btn outline-btn">START A PROJECT</a>
            </div>
        </div>
        
        <!-- RIGHT SIDE FLOATING LOGO -->
        <div class="hero-image fade-in">
            <!-- Maine yaha wahi ARC Studios ka logo use kiya hai, tum chaho to 3D icon bhi dal sakte ho baad me -->
            <img src="https://drive.google.com/uc?export=view&id=1A77SnUtHpmBYSaNXjcNRmf9Wb0Q1WhdJ" alt="Arc Studios Floating Logo">
        </div>
    </section>

    <!-- JAVASCRIPT FOR ANIMATIONS & SOUND -->
    <script>
        // === 1. CLICK SOUND & RIPPLE EFFECT ===
        const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        clickSound.volume = 0.5;

        document.addEventListener('click', function(e) {
            clickSound.currentTime = 0;
            clickSound.play().catch(() => {});

            let ripple = document.createElement('div');
            ripple.classList.add('ripple');
            document.body.appendChild(ripple);
            
            ripple.style.left = (e.pageX - 10) + 'px';
            ripple.style.top = (e.pageY - 10) + 'px';
            ripple.style.width = ripple.style.height = '20px';

            setTimeout(() => { ripple.remove(); }, 400);
        });

        // === 2. FADE-IN SCROLL ANIMATION ===
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        });
        document.querySelectorAll('.fade-in').forEach((element) => { observer.observe(element); });

        // === 3. FIRE PARTICLES CANVAS SCRIPT ===
        const canvas = document.getElementById("fire-canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const colors = ['#ff0000', '#ff4500', '#ff8c00', '#ffb300'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100; // Niche se start hoga
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1; // Halka left/right movement
                this.speedY = Math.random() * -3 - 1; // Upar ki taraf speed
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.size -= 0.02; // Upar jate hue chhota hoga
                if (this.size < 0.2) {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 10;
                    this.size = Math.random() * 3 + 1;
                }
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000; // Screen size ke hisab se quantity
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener("resize", function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        initParticles();
        animateParticles();
    </script>
</body>
</html>
